name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install pkg-config openssl@3 libplist

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test
