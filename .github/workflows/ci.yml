name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Package.swift requires Swift 6.2. The macOS 26 arm64 image ships with
    # the matching Xcode toolchain while the macOS 15 image currently has 6.1.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install native dependencies
        run: brew install pkg-config openssl@3 libplist

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test
