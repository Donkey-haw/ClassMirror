name: 기능 제안
description: ClassMirror의 범위에 맞는 기능을 제안합니다.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 이름보다 실제 수업 흐름의 문제를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: flow
    attributes:
      label: 원하는 사용 흐름
      description: 교사가 어떤 순서로 무엇을 해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용하는 대안

  - type: checkboxes
    id: scope
    attributes:
      label: 범위 확인
      options:
        - label: 이 제안이 iPad/iPhone 화면을 Mac 창으로 수신하는 핵심 흐름과 관련되어 있습니다.
          required: true
